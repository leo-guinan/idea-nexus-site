name: Sync public pages to Chroma Cloud
on:
  push:
    branches: [main]
    paths:
      - 'site/pages/**'
      - 'scripts/sync_chroma_cloud.py'
      - '.github/workflows/chroma-sync.yml'
  workflow_dispatch:
jobs:
  sync:
    runs-on: ubuntu-latest
    env:
      INV_CHROMA_API_KEY: ${{ secrets.INV_CHROMA_API_KEY }}
      INV_CHROMA_TENANT: ${{ secrets.INV_CHROMA_TENANT }}
      INV_CHROMA_DATABASE: ${{ secrets.INV_CHROMA_DATABASE }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Chroma client
        run: python -m pip install 'chromadb==1.5.9'
      - name: Sync public pages
        if: ${{ env.INV_CHROMA_API_KEY != '' && env.INV_CHROMA_TENANT != '' && env.INV_CHROMA_DATABASE != '' }}
        run: python3 scripts/sync_chroma_cloud.py
      - name: Report missing GitHub secrets
        if: ${{ env.INV_CHROMA_API_KEY == '' || env.INV_CHROMA_TENANT == '' || env.INV_CHROMA_DATABASE == '' }}
        run: "echo 'Chroma sync skipped: configure INV_CHROMA_API_KEY, INV_CHROMA_TENANT, and INV_CHROMA_DATABASE as GitHub Secrets.'"
